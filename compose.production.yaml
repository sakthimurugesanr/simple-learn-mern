# Run with infrastructure provided through private managed endpoints.
services:
  migrate:
    image: ${API_IMAGE:?Set immutable API_IMAGE}
    env_file: .env.production
    command: ['pnpm', 'db:migrate']
    restart: 'no'
  api:
    image: ${API_IMAGE:?Set immutable API_IMAGE}
    env_file: .env.production
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ['/tmp']
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ['127.0.0.1:4000:4000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      retries: 3
  worker:
    image: ${API_IMAGE:?Set immutable API_IMAGE}
    env_file: .env.production
    command: ['node', 'apps/api/dist/worker.js']
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    image: ${WEB_IMAGE:?Set immutable WEB_IMAGE}
    env_file: .env.production
    restart: unless-stopped
    init: true
    ports: ['127.0.0.1:3000:3000']
