services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aurel
      POSTGRES_PASSWORD: aurel_local_only
      POSTGRES_DB: aurel
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aurel']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: aurel_local
      MINIO_ROOT_PASSWORD: local_storage_only_change_me
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio_data:/data']
  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    entrypoint: /bin/sh
    command:
      - -c
      - 'until mc alias set local http://minio:9000 aurel_local local_storage_only_change_me; do sleep 2; done; mc mb --ignore-existing local/aurel; mc anonymous set download local/aurel'
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  postgres_data:
  redis_data:
  minio_data:
