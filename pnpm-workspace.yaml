packages:
  - apps/*
  - packages/*
nodeLinker: isolated
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  argon2: true
  esbuild: true
  sharp: true
  msgpackr-extract: true
  core-js: true

overrides:
  effect: '^3.20.0'
  deepmerge-ts: '^8.0.0'

verifyDepsBeforeRun: false
