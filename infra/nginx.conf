limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
upstream aurel_web { server 127.0.0.1:3000; }
upstream aurel_api { server 127.0.0.1:4000; }
server {
  listen 80;
  server_name _;
  # Install the real hostname and use Certbot --nginx to enable HTTPS before launch.
  server_tokens off;
  client_max_body_size 9m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://aurel_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    proxy_pass http://aurel_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
