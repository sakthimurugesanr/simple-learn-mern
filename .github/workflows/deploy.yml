name: Publish deployment images
on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image namespace
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAMESPACE }}/api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAMESPACE }}/web:${{ github.sha }}
          build-args: |
            API_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
            STORAGE_HOST=${{ vars.STORAGE_HOST }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAMESPACE }}/api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Deployment handoff
        run: echo 'Immutable images published. Follow DEPLOYMENT.md to migrate and deploy on the configured host. Host rollout is not automated until credentials and environments are configured.'
