name: Verify commerce
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aurel
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: aurel_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U aurel' --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd 'redis-cli ping' --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://aurel:test_password@localhost:5432/aurel_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-ephemeral-signing-key-that-is-at-least-48-characters
      WEB_URL: http://localhost:3000
      SMTP_URL: smtp://localhost:1025
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ci-test
      S3_SECRET_KEY: ci-test
      S3_BUCKET: aurel
      S3_PUBLIC_URL: http://localhost:9000/aurel
      RUN_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NODE_ENV: production
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=chromium
        env:
          RUN_INTEGRATION: '0'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            playwright-report
            test-results
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
